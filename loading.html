.nlc{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;transition:.4s}.nlm{width:72px;overflow:visible}.nlm path{fill:#E0A23B;fill-opacity:0;stroke:#E0A23B;stroke-width:1.5px;animation:nld .7s .1s forwards,nlf .3s .8s forwards}
.nln{height:28px;margin-top:16px;fill:#F4F6F3;opacity:0;animation:nlu .5s .5s cubic-bezier(.22,1,.36,1) forwards}.nle{margin-top:14px;font:500 11px system-ui,sans-serif;letter-spacing:.24em;color:#7FA38E;opacity:0;animation:nlo .4s .65s forwards}
.nlr{position:relative;margin-top:40px;width:220px;opacity:0;animation:nlo .3s .7s forwards}.nlr svg{display:block;width:100%;overflow:visible;fill:none;stroke-width:1.5px}.nld{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:#E0A23B;box-shadow:0 0 8px rgba(224,162,59,.8)}
.nlx .nlc{transform:translateY(-12px);opacity:0}.nlx .nld{animation:nlz .3s}
@keyframes nld{to{stroke-dashoffset:0}}@keyframes nlb{to{transform:scale(1.02)}}@keyframes nlp{from{opacity:.6}}@keyframes nlf{to{fill-opacity:1;stroke-opacity:0}}@keyframes nlu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes nlo{to{opacity:1}}@keyframes nlz{50%{scale:2.5}}
@media (max-width:767px){.nlm{width:56px}.nln{height:22px}.nlr{width:180px}}@media (prefers-reduced-motion:reduce){#ns-loader *{animation:none!important;opacity:1!important;stroke-dashoffset:0}.nlm path{fill-opacity:1;stroke-opacity:0}.nld{display:none}}
@media (prefers-reduced-motion:reduce){#ns-loader.nlx .nlc{opacity:0!important;transition:opacity .3s}}</style>
